<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>レース観戦</title>
    <link rel="stylesheet" href="phone.css" />
    <link rel="stylesheet" href="race.css" />
  </head>
  <body>
    <div id="demo-bar" class="demo-bar" hidden>
      <span class="demo-tag">モック</span>
      <span id="demo-scene"></span>
      <button id="demo-next" type="button">次の場面</button>
    </div>

    <header class="head">
      <p class="title">レース進行中</p>
      <section id="race-event" class="race-event">
        <p class="event-label">お題</p>
        <p id="side-prompt" class="side-prompt"></p>
      </section>
    </header>

    <main>
      <section class="panel">
        <h2 class="panel-title">購入したマ券</h2>
        <ul id="my-bets" class="bet-list"></ul>
      </section>
    </main>

    <script src="race-state.js"></script>
    <script src="race-view.js"></script>
    <script src="race-mock.js"></script>
    <script src="live-connection.js"></script>
    <script src="live.js"></script>
  <script src="race-app.js"></script>
  </body>
</html>
