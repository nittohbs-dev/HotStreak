<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>マ券ドラフト</title>
    <link rel="stylesheet" href="phone.css" />
    <link rel="stylesheet" href="betting.css" />
  </head>
  <body>
    <div id="demo-bar" class="demo-bar" hidden>
      <span class="demo-tag">デモ</span>
      <span id="demo-scene"></span>
      <button id="demo-next" type="button">次の場面</button>
    </div>

    <header class="head">
      <div class="head-actions">
        <span id="my-balance" class="my-balance"></span>
        <button id="field-cards-button" class="field-cards-button" type="button">場のカード</button>
      </div>
      <p id="turn-status" class="turn-status"></p>
      <p id="turn-detail" class="turn-detail"></p>
      <p id="race-meta" class="race-meta"></p>
    </header>

    <div id="field-cards-modal" class="field-cards-modal" hidden>
      <section class="field-cards-sheet" role="dialog" aria-modal="true" aria-labelledby="field-cards-title">
        <header class="field-cards-head">
          <h2 id="field-cards-title">場のカード</h2>
          <button id="field-cards-close" class="field-cards-close" type="button" aria-label="閉じる">×</button>
        </header>
        <div id="field-cards-list" class="field-cards-list"></div>
      </section>
    </div>

    <main>
      <section class="panel">
        <h2 class="panel-title">取得できる札</h2>
        <ul id="ticket-list" class="ticket-list"></ul>
      </section>

      <section id="double-picker" class="panel" hidden>
        <h2 class="panel-title">配当ダブルにする札</h2>
        <div id="double-slots" class="double-slots"></div>
        <p class="hint">★を付けた札だけ配当×2（最終レースのみ）</p>
      </section>
    </main>

    <footer class="foot">
      <h2 class="panel-title">所持中のマ券</h2>
      <ul id="held-tickets" class="held-list"></ul>
      <p id="notice" class="notice"></p>
      <button id="confirm-button" class="confirm" type="button" disabled>この札に投票する</button>
      <div id="host-controls" class="host-controls" hidden>
        <button id="host-advance" class="confirm" type="button" disabled>次へ</button>
        <p id="host-reason" class="notice" aria-live="polite"></p>
      </div>
    </footer>

    <script src="ticket-payouts.js"></script>
    <script src="card-sprite.js"></script>
    <script src="betting-state.js"></script>
    <script src="live-connection.js"></script>
    <script src="betting-view.js"></script>
    <script src="betting-demo.js"></script>
    <script src="live.js"></script>
  <script src="betting-app.js"></script>
  </body>
</html>
