name: Organize root design docs

on:
  push:
    branches: [docs/organize-root-design-docs]
    paths:
      - .github/workflows/organize-root-design-docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-root-design-docs
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/organize-root-design-docs
          fetch-depth: 0

      - name: Move root design files into docs/design/wireframes
        run: |
          set -euo pipefail
          mkdir -p docs/design/wireframes
          moved=0

          if [ -f hotstreak-wireframes.html ]; then
            git mv hotstreak-wireframes.html docs/design/wireframes/hotstreak-wireframes.html
            moved=1
          fi
          if [ -f screen-01-title.html ]; then
            git mv screen-01-title.html docs/design/wireframes/screen-01-title.html
            moved=1
          fi
          if [ -f "試合開始前設計" ]; then
            git mv "試合開始前設計" "docs/design/wireframes/試合開始前設計.png"
            moved=1
          fi
          if [ -f 4F69B9E7-6B35-4E1E-9773-E09EAC933EE5.png ]; then
            git mv 4F69B9E7-6B35-4E1E-9773-E09EAC933EE5.png "docs/design/wireframes/ゲーム進行画面-ディスプレイ側.png"
            moved=1
          fi

          if [ -f .github/workflows/organize-root-design-docs.yml ]; then
            git rm .github/workflows/organize-root-design-docs.yml
            moved=1
          fi

          if [ "$moved" -eq 0 ]; then
            echo "Nothing to move"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: ルートの設計ラフを docs/design/wireframes へ移す"
          git push origin HEAD:docs/organize-root-design-docs
