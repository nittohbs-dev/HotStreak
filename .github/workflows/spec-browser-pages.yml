name: Spec Browser Pages

on:
  push:
    branches: [develop]
    paths:
      - 'tools/spec-browser/**'
      - 'docs/design/**'
      - '.github/workflows/spec-browser-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-spec-browser
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/spec-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/spec-browser/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /HotStreak/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/spec-browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
