<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タイトル画面｜ホットストリーク ワイヤーフレーム</title><style>
:root{--ink:#1a1a1a;--muted:#6f6f6b;--line:#d6d6d2;--paper:#fff;--fill:#f4f4f2;--accent:#2f6fb0;--accent-bg:#e8f0f8;--ok:#2e6b45;--ok-bg:#e7f1ea;--risk:#9a4a2f;--risk-bg:#f7ebe5}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px;background:#e9e9e5;color:var(--ink);
font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto}
.sheet-head{margin:0 0 28px}
.sheet-head h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sheet-head p{margin:0;color:var(--muted);font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.slot{width:340px}
.slot-label{font-size:13px;font-weight:600;margin:0 0 2px}
.slot-note{font-size:12px;color:var(--muted);margin:0 0 10px}
.phone{width:340px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.stamp{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:0 0 10px}
.h1{font-size:20px;font-weight:600;margin:0 0 4px}
.h2{font-size:16px;font-weight:600;margin:0 0 4px}
.sub{font-size:12px;color:var(--muted);margin:0 0 14px}
.panel{background:var(--fill);border-radius:8px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;
border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.row+.row{margin-top:6px}
.row.sel{border:2px solid var(--accent);padding:9px 11px}
.row.off{opacity:.45}
.stack{display:flex;flex-direction:column;gap:6px}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--fill);border-radius:8px;padding:10px 2px;text-align:center}
.cell.lead{background:#f6efe2}
.cell .r{font-size:11px;color:var(--muted);margin:0}
.cell .n{font-size:13px;margin:4px 0 0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--paper);
border:1px solid var(--line);margin:6px auto}
.hand{border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;min-height:126px;
display:flex;flex-direction:column;justify-content:space-between}
.hand.sel{border:2px solid var(--accent);padding:11px 5px}
.hand .cn{font-size:13px;font-weight:600;margin:0}
.hand .ct{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.4}
.hand .cnew{font-size:10px;color:var(--accent);margin:6px 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;
background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:9px 11px;
font-size:13px;font-weight:600}
.bar span.r{font-weight:400;font-size:12px}
.timer{display:flex;align-items:center;justify-content:space-between;
border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.timer b{font-size:18px}
.event{background:#f6efe2;border-radius:8px;padding:11px;margin-bottom:12px}
.event .k{font-size:11px;color:var(--muted);margin:0 0 2px}
.event .v{font-size:14px;font-weight:600;margin:0}
.event .d{font-size:12px;color:var(--muted);margin:2px 0 0}
.tk{display:flex;flex-direction:column;gap:2px}
.tk .nm{font-size:14px}
.side{display:inline-block;font-size:11px;border-radius:4px;padding:1px 7px;margin-left:6px;
background:var(--fill);color:var(--muted)}
.side.risky{background:var(--risk-bg);color:var(--risk)}
.flip{font-size:11px;color:var(--accent)}
.pay{text-align:right}
.pay .v{font-size:15px;font-weight:600;margin:0}
.pay .c{font-size:11px;color:var(--muted);margin:0}
.x2{display:inline-block;font-size:11px;font-weight:600;background:var(--risk-bg);color:var(--risk);
border-radius:4px;padding:1px 6px;margin-left:5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--fill);border-radius:6px;padding:5px 11px}
.tag.risky{background:var(--risk-bg);color:var(--risk)}
.tag.empty{background:none;border:1px dashed var(--line);color:var(--muted)}
.btn{display:block;width:100%;margin-top:14px;padding:11px;border:1px solid var(--ink);
border-radius:8px;background:var(--paper);font:inherit;font-size:14px;cursor:pointer}
.field{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.field .k{font-size:11px;color:var(--muted);margin:0 0 2px}
.field .v{font-size:15px;margin:0}
.field .cur{color:var(--accent)}
.ghost{border:1px dashed var(--line);border-radius:8px;padding:11px;text-align:center;
font-size:12px;color:var(--muted)}
.divider{border-top:1px solid var(--line);margin:14px 0 10px}
.lbl{font-size:12px;color:var(--muted);margin:0 0 6px}
.money{background:var(--ok-bg);border-radius:8px;padding:13px;margin-bottom:14px}
.money .k{font-size:12px;color:var(--ok);margin:0 0 2px}
.money .v{font-size:24px;font-weight:600;color:var(--ok);margin:0 0 4px}
.money .d{font-size:12px;color:var(--ok);margin:0}
.rank{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.rank.me{color:var(--accent);font-weight:600}
.vote{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.vote:last-child{border-bottom:none}
.vote .p{font-size:13px}
.vote .t{font-size:11px;color:var(--muted)}
.spec{width:340px;font-size:12px;color:var(--muted)}
.spec h3{font-size:13px;color:var(--ink);margin:0 0 6px}
.spec ul{margin:0;padding-left:18px}
.spec li{margin-bottom:4px}
@media print{body{background:#fff;padding:0}.slot{page-break-inside:avoid}}
</style></head>
<body><div class="wrap">
<div class="sheet-head"><h1>タイトル画面｜ホットストリーク ワイヤーフレーム</h1><p>名前を入力してQRで参加</p></div>
<div class="phone">
<p class="stamp">画面1 / タイトル</p>
<p class="h1" style="text-align:center">ホットストリーク</p>
<p class="sub" style="text-align:center">QRを読み取って参加</p>
<div class="field">
<p class="k">プレイヤー名</p>
<p class="v cur">ヤマダ<span style="opacity:.5">|</span></p>
</div>
<div class="panel" style="text-align:center;margin-bottom:14px">
<p class="lbl" style="margin:0 0 2px">参加者</p>
<p style="font-size:26px;font-weight:600;margin:0">4 <span style="font-size:13px;color:var(--muted)">人</span></p>
</div>
<div class="stack" style="margin-bottom:14px">
<div class="row"><span>ヤマダ（自分）</span><span style="font-size:12px;color:var(--accent)">入力済</span></div>
<div class="row"><span>サトウ</span><span style="font-size:12px;color:var(--muted)">入力済</span></div>
<div class="row"><span style="color:var(--muted)">プレイヤー3</span><span style="font-size:12px;color:var(--muted)">入力中</span></div>
<div class="row"><span style="color:var(--muted)">プレイヤー4</span><span style="font-size:12px;color:var(--muted)">入力中</span></div>
</div>
<button class="btn">この名前で決定</button>
<div class="ghost" style="margin-top:10px">全員の入力後、物理ボタンでカード提出へ</div>
</div>
</div></body></html>
